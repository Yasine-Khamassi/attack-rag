[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-rag"
version = "0.1.0"
description = "Hybrid-search RAG over MITRE ATT&CK with a reusable RAG core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Local Postgres + pgvector without Docker (development only; see core/db.py)
local-db = ["pgserver>=0.1.4"]
# Cross-encoder reranking (core/rerank.py). On CPU-only machines install torch first from
# https://download.pytorch.org/whl/cpu to avoid the large CUDA build.
rerank = ["sentence-transformers>=3"]
# Claude API (query translation, reranking, answers) - core/llm.py
llm = ["anthropic>=1"]
# Web API + page (products/attack/api.py)
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["core*", "products*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
