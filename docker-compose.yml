# Postgres 16 + pgvector. `docker compose up -d db`, then set DATABASE_URL (see .env.example).
# No Docker? `core.db` falls back to a local Postgres from the `pgserver` package (pip install -e ".[local-db]").
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-dev-only}
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
